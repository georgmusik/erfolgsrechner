<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Erfolgsrechner – Was wäre wenn</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f0f7f3;min-height:100vh}
.app{padding:14px;max-width:700px;margin:0 auto}
.h1{font-size:28px;font-weight:600;color:#111;margin-bottom:12px}
.card{background:#fff;border-radius:16px;border:0.5px solid #ddeee5;padding:14px}
.lbl-main{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;color:#1dbe70}
.row1{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.event-input{font-size:15px;font-weight:500;color:#111;border:1px solid #ddeee5;border-radius:10px;outline:none;width:100%;background:#fafffe;padding:7px 10px;margin-bottom:8px}
.date-row{display:flex;align-items:center;gap:6px;color:#8aab96;font-size:11px;margin-bottom:8px}
.days-inline{display:flex;align-items:baseline;gap:5px;margin-top:4px}
.days-big-sm{font-size:26px;font-weight:600;color:#111;line-height:1}
.days-lbl-sm{font-size:10px;color:#8aab96;letter-spacing:.5px;text-transform:uppercase}
.settings-inner{display:flex;gap:0;align-items:flex-start}
.settings-divider{width:0.5px;background:#ddeee5;margin:0 10px;align-self:stretch}
.ip-btn{width:34px;height:34px;border-radius:50%;background:#f0faf5;border:0.5px solid #9fe0be;color:#1dbe70;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:600;line-height:1;flex-shrink:0;user-select:none}
.ip-btn:active{background:#ddf5ea}
.ring-wrap{position:relative;width:80px;height:80px;margin-top:6px}
.ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.ring-num{font-size:19px;font-weight:600;color:#111;line-height:1}
.ctrl-row{display:flex;align-items:center;gap:8px;margin-top:8px;justify-content:center}
.mid-card{background:#fff;border-radius:16px;border:0.5px solid #ddeee5;padding:14px;margin-bottom:10px}
.mid-inner{display:grid;grid-template-columns:160px 1fr;gap:14px;align-items:center}
.bar-row{display:grid;grid-template-columns:9px 96px 1fr 32px 54px;gap:5px;align-items:center;margin-bottom:8px}
.bar-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.bar-label{font-size:11px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
.bar-track{height:12px;background:#f0f4f2;border-radius:5px;overflow:hidden}
.bar-fill{height:12px;border-radius:5px;transition:width .4s}
.bar-pct{font-size:10px;color:#9bbeaa;text-align:right}
.bar-ip{font-size:11px;font-weight:600;color:#111;text-align:right}
.filter-card{background:#fff;border-radius:16px;border:0.5px solid #ddeee5;padding:10px 14px;margin-bottom:10px}
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{display:flex;align-items:center;gap:4px;padding:6px 11px;border-radius:20px;font-size:11px;border:0.5px solid #cce8d8;background:#f0faf5;color:#3b8a5a;cursor:pointer;user-select:none}
.tbl-card{background:#fff;border-radius:16px;border:0.5px solid #ddeee5;padding:14px}
.tbl-title{font-size:10px;font-weight:600;color:#8aab96;letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
.trow-grid{display:grid;grid-template-columns:24px 24px 1fr 36px 46px 30px 58px 80px;gap:3px;align-items:center}
.trow{padding:10px 0;border-bottom:0.5px solid #eef5f1}
.trow:last-child{border-bottom:none}
.trow.dim .td-nm,.trow.dim .td-sm,.trow.dim .td-g,.trow.dim .conv-field{opacity:.3}
.th{font-size:9px;color:#9bbeaa;letter-spacing:.3px;text-transform:uppercase}
.td-nm{font-size:13px;font-weight:500;color:#111;display:flex;align-items:center;gap:4px;min-width:0}
.td-nm .name-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-g{font-size:13px;font-weight:600;color:#1dbe70;text-align:right}
.td-sm{font-size:11px;color:#aac4b4;text-align:center}
.chk{width:24px;height:24px;border-radius:6px;border:2px solid #cce8d8;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;user-select:none}
.chk.on{background:#1dbe70;border-color:#1dbe70}
.avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex-shrink:0;color:#fff}
.tbadge{font-size:9px;border-radius:6px;padding:3px 4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;max-width:78px}
.conv-field{width:32px;font-size:13px;font-weight:600;color:#1dbe70;border:none;background:transparent;text-align:center;outline:none;padding:0;-moz-appearance:textfield}
.conv-field::-webkit-outer-spin-button,.conv-field::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pareto-dot{width:7px;height:7px;border-radius:50%;background:#1dbe70;flex-shrink:0;display:inline-block}
.add-btn{display:flex;align-items:center;gap:8px;padding-top:12px;color:#8aab96;font-size:12px;cursor:pointer}
.add-circle{width:24px;height:24px;border-radius:50%;border:0.5px solid #cce8d8;display:flex;align-items:center;justify-content:center;font-size:18px;color:#1dbe70;flex-shrink:0}
.status-bar{font-size:11px;color:#8aab96;text-align:center;padding:8px;margin-bottom:6px}
.status-bar.err{color:#e05a7a}
.pw-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(240,247,243,0.97);display:flex;align-items:center;justify-content:center;z-index:999}
.pw-box{background:#fff;border-radius:20px;border:0.5px solid #ddeee5;padding:32px 28px;text-align:center;max-width:320px;width:90%}
.pw-logo{font-size:32px;font-weight:700;color:#1dbe70;margin-bottom:4px}
.pw-sub{font-size:12px;color:#8aab96;margin-bottom:24px}
.pw-input{width:100%;font-size:16px;border:1px solid #ddeee5;border-radius:10px;padding:10px 14px;outline:none;text-align:center;letter-spacing:3px;color:#111;background:#fafffe;margin-bottom:12px}
.pw-input:focus{border-color:#1dbe70}
.pw-btn{width:100%;background:#1dbe70;color:#fff;font-size:14px;font-weight:600;border:none;border-radius:10px;padding:11px;cursor:pointer}
.pw-btn:active{background:#18a860}
.pw-err{font-size:12px;color:#e05a7a;margin-top:8px;min-height:18px}
@media(max-width:420px){
  .h1{font-size:22px}
  .row1{grid-template-columns:1fr}
  .mid-inner{grid-template-columns:1fr;justify-items:center}
  .mid-inner>div:last-child{width:100%}
  .trow-grid{grid-template-columns:24px 24px 1fr 32px 40px 26px 50px 70px;gap:2px}
  .td-nm{font-size:12px}
  .td-g{font-size:11px}
  .td-sm{font-size:10px}
  .tbadge{font-size:8px;padding:2px 3px;max-width:68px}
  .conv-field{width:28px;font-size:11px}
  .bar-row{grid-template-columns:8px 80px 1fr 26px 46px}
  .bar-label{max-width:80px}
}
@media(max-width:340px){
  .trow-grid{grid-template-columns:22px 22px 1fr 28px 0 0 46px 62px}
  .td-sm{display:none}
}
</style>
</head>
<body>

<div class="pw-overlay" id="pwOverlay">
  <div class="pw-box">
    <div class="pw-logo">Erfolgsrechner</div>
    <div class="pw-sub">Was wäre wenn?</div>
    <input class="pw-input" type="password" id="pwInput" placeholder="Passwort" maxlength="30"
      onkeydown="if(event.key==='Enter')checkPW()"/>
    <button class="pw-btn" onclick="checkPW()">Zugang</button>
    <div class="pw-err" id="pwErr"></div>
  </div>
</div>

<div class="app" id="mainApp" style="display:none">
  <div class="status-bar" id="statusBar">Verbinde mit Datenbank…</div>
  <div class="h1">Was wäre wenn</div>

  <div class="row1">
    <div class="card">
      <div class="lbl-main">Aktuelles Ziel</div>
      <input class="event-input" id="eventName" value="" placeholder="Event eingeben…"
        onchange="saveSettings()"/>
      <div class="date-row">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8aab96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <input id="goalDate" type="date" style="font-size:11px;color:#8aab96;border:none;background:transparent;outline:none"
          onchange="updateDays();saveSettings()"/>
      </div>
      <div style="height:0.5px;background:#eef5f1;margin-bottom:8px"></div>
      <div class="days-inline">
        <div class="days-big-sm" id="daysNum">—</div>
        <div class="days-lbl-sm">Tage bis Ziel</div>
      </div>
    </div>

    <div class="card">
      <div class="settings-inner">
        <div style="flex:1;display:flex;flex-direction:column;align-items:center">
          <div class="lbl-main" style="align-self:flex-start">Zeitraum</div>
          <div class="ring-wrap">
            <svg id="ringZeitraum" width="80" height="80" viewBox="0 0 80 80" style="display:block" role="img" aria-label="Zeitraum Ring"></svg>
            <div class="ring-center"><div class="ring-num" id="cdNum">120</div></div>
          </div>
          <div class="ctrl-row">
            <div class="ip-btn" onclick="changeCD(-30)" aria-label="Zeitraum verringern">−</div>
            <div class="ip-btn" onclick="changeCD(+30)" aria-label="Zeitraum erhöhen">+</div>
          </div>
        </div>
        <div class="settings-divider"></div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center">
          <div class="lbl-main" style="align-self:flex-start">IP-Wert</div>
          <div class="ring-wrap">
            <svg id="ringIP" width="80" height="80" viewBox="0 0 80 80" style="display:block" role="img" aria-label="IP-Wert Ring"></svg>
            <div class="ring-center"><div class="ring-num" id="ipNum">100</div></div>
          </div>
          <div class="ctrl-row">
            <div class="ip-btn" onclick="changeIP(-20)" aria-label="IP-Wert verringern">−</div>
            <div class="ip-btn" onclick="changeIP(+20)" aria-label="IP-Wert erhöhen">+</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="mid-card">
    <div class="mid-inner">
      <div style="display:flex;justify-content:center;align-items:center">
        <div style="position:relative;width:160px;height:160px">
          <svg id="donutSVG" width="160" height="160" viewBox="0 0 160 160" style="display:block" role="img" aria-label="Gesamterfolg Donut"></svg>
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:96px">
            <div style="font-size:8px;font-weight:600;color:#1dbe70;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">Gesamterfolg</div>
            <div id="totalVal" style="font-size:20px;font-weight:600;color:#111;line-height:1.1">—</div>
          </div>
        </div>
      </div>
      <div id="barSection"></div>
    </div>
  </div>

  <div class="filter-card">
    <div class="filter-row" id="filterRow">
      <span class="fbtn" data-t="alle" onclick="toggleTeam('alle',this)" style="background:#1dbe70;border-color:#1dbe70;color:#fff;font-weight:600">Alle</span>
    </div>
  </div>

  <div class="tbl-card">
    <div class="tbl-title">Team Member</div>
    <div class="trow-grid" style="padding-bottom:8px;border-bottom:1px solid #e4f0e9">
      <div class="th"></div><div class="th"></div>
      <div class="th">Name</div>
      <div class="th" style="text-align:center">Gespr.</div>
      <div class="th" style="text-align:center">Kont.</div>
      <div class="th" style="text-align:center">10%</div>
      <div class="th" style="text-align:right">IPs</div>
      <div class="th" style="text-align:center">Team</div>
    </div>
    <div id="tableBody"></div>
    <div class="add-btn" onclick="addMember()">
      <div class="add-circle">+</div>
      <span>Team Member hinzufügen</span>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  PASSWORD: 'team2025',
  SHEET_URL: 'https://script.google.com/macros/s/AKfycbyFTtJsLr3Whk8HDPi5ya8ZRb_sn59ySAvHyDXybNrHGPZxzjc2bWIStU3hQhdeN22P/exec'
};

const TEAM_COLORS=['#1dbe70','#4a6bdf','#9b6ddf','#e8a84a','#e05a7a','#e06030','#3090e0','#a040c0','#5dcaa5','#d4485a'];
const AVATAR_COLORS=['#e05a7a','#4a6bdf','#e8a84a','#9b6ddf','#1dbe70','#e06030','#3090e0','#a040c0','#d4485a','#5dcaa5','#854F0B','#185FA5'];
const teamColorMap={};
let members=[];
let cd=120,ipVal=100;
const CD_MIN=30,CD_MAX=365,IP_MIN=20,IP_MAX=500;
let activeTeams=new Set(['alle']);
let saveTimer=null;

function checkPW(){
  const v=document.getElementById('pwInput').value;
  if(v===CONFIG.PASSWORD){
    document.getElementById('pwOverlay').style.display='none';
    document.getElementById('mainApp').style.display='block';
    loadFromSheet();
  } else {
    document.getElementById('pwErr').textContent='Falsches Passwort';
    document.getElementById('pwInput').value='';
  }
}

function setStatus(msg,isErr){
  const el=document.getElementById('statusBar');
  el.textContent=msg;
  el.className='status-bar'+(isErr?' err':'');
}

async function loadFromSheet(){
  if(CONFIG.SHEET_URL==='NICHT_GESETZT'){
    setStatus('Demo-Modus (keine Sheet-URL konfiguriert)');
    loadDemoData();return;
  }
  try{
    setStatus('Lade Daten…');
    const res=await fetch(CONFIG.SHEET_URL+'?action=load');
    const data=await res.json();
    if(data.settings){
      document.getElementById('eventName').value=data.settings.eventName||'';
      document.getElementById('goalDate').value=data.settings.goalDate||'';
      cd=parseInt(data.settings.cd)||120;
      ipVal=parseInt(data.settings.ipVal)||100;
      updateDays();
    }
    members=(data.members||[]).map((m,i)=>({
      id:i,name:m.name,conv:parseInt(m.conv)||1,
      team:m.team,active:m.active!=='false'&&m.active!==false
    }));
    renderAll();
    setStatus('Zuletzt geladen: '+new Date().toLocaleTimeString('de-DE'));
  }catch(e){
    setStatus('Verbindungsfehler – Demo-Modus',true);
    loadDemoData();
  }
}

async function saveToSheet(){
  if(CONFIG.SHEET_URL==='NICHT_GESETZT')return;
  try{
    setStatus('Speichert…');
    const payload={
      action:'save',
      settings:{
        eventName:document.getElementById('eventName').value,
        goalDate:document.getElementById('goalDate').value,
        cd,ipVal
      },
      members:members.map(m=>({name:m.name,conv:m.conv,team:m.team,active:m.active}))
    };
    await fetch(CONFIG.SHEET_URL,{method:'POST',body:JSON.stringify(payload)});
    setStatus('Gespeichert: '+new Date().toLocaleTimeString('de-DE'));
  }catch(e){setStatus('Speicherfehler',true);}
}

function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveToSheet,1200);}
function saveSettings(){scheduleSave();}

function loadDemoData(){
  document.getElementById('eventName').value='Jahresevent Wien 2026';
  document.getElementById('goalDate').value='2026-09-30';
  cd=120;ipVal=100;
  members=[
    {id:0,name:'Georg M.',conv:3,team:'Team Huber',active:true},
    {id:1,name:'Julia F.',conv:3,team:'Team Huber',active:true},
    {id:2,name:'Anna K.',conv:2,team:'Team Huber',active:true},
    {id:3,name:'Markus B.',conv:5,team:'Team Max',active:true},
    {id:4,name:'Sandra L.',conv:2,team:'Team Max',active:true},
    {id:5,name:'Peter W.',conv:3,team:'Team Süd',active:true},
    {id:6,name:'Klaus R.',conv:1,team:'Team Süd',active:false},
  ];
  updateDays();renderAll();
}

function getColor(t){if(!teamColorMap[t]){const i=Object.keys(teamColorMap).length%TEAM_COLORS.length;teamColorMap[t]=TEAM_COLORS[i];}return teamColorMap[t];}
function avColor(id){return AVATAR_COLORS[id%AVATAR_COLORS.length];}
function lighten(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgb(${Math.round(r+a*(255-r))},${Math.round(g+a*(255-g))},${Math.round(b+a*(255-b))})`;}
function initials(n){return n.trim().split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);}
function calc(m){const c=m.conv*cd,t=Math.round(c*.1),ips=Math.round(t*ipVal);return{c,t,ips};}
function allActive(){return members.filter(m=>m.active);}
function totalIPs(){return allActive().reduce((s,m)=>s+calc(m).ips,0);}
function teamGroups(){const g={};allActive().forEach(m=>{if(!g[m.team])g[m.team]=0;g[m.team]+=calc(m).ips;});return g;}
function visibleMembers(){if(activeTeams.has('alle'))return members;return members.filter(m=>activeTeams.has(m.team));}
function getFiltered(){const tg=teamGroups();if(activeTeams.has('alle'))return{...tg};const f={};activeTeams.forEach(t=>{if(tg[t])f[t]=tg[t];});return f;}

function updateDays(){
  const gd=document.getElementById('goalDate').value;
  if(!gd){document.getElementById('daysNum').textContent='—';return;}
  document.getElementById('daysNum').textContent=Math.max(0,Math.round((new Date(gd)-new Date())/864e5));
}

function drawSmallRing(svgId,val,min,max){
  const svg=document.getElementById(svgId);svg.innerHTML='';
  const cx=40,cy=40,R=35,r=24,rm=(R+r)/2,sw=R-r;
  const pct=Math.min(1,Math.max(0,(val-min)/(max-min)));
  const mk=(col)=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',rm);c.setAttribute('fill','none');c.setAttribute('stroke',col);c.setAttribute('stroke-width',sw);return c;};
  svg.appendChild(mk('#e8f5ee'));
  if(pct>0){
    if(pct>=1){svg.appendChild(mk('#1dbe70'));}
    else{
      const sA=-Math.PI/2,span=pct*2*Math.PI,eA=sA+span;
      const x1=cx+rm*Math.cos(sA),y1=cy+rm*Math.sin(sA),x2=cx+rm*Math.cos(eA),y2=cy+rm*Math.sin(eA);
      const arc=document.createElementNS('http://www.w3.org/2000/svg','path');
      arc.setAttribute('d',`M${x1},${y1}A${rm},${rm},0,${span>Math.PI?1:0},1,${x2},${y2}`);
      arc.setAttribute('fill','none');arc.setAttribute('stroke','#1dbe70');arc.setAttribute('stroke-width',sw);arc.setAttribute('stroke-linecap','round');
      svg.appendChild(arc);
    }
  }
  const inner=document.createElementNS('http://www.w3.org/2000/svg','circle');
  inner.setAttribute('cx',cx);inner.setAttribute('cy',cy);inner.setAttribute('r',r);inner.setAttribute('fill','#fff');svg.appendChild(inner);
}

function drawDonut(segments){
  const svg=document.getElementById('donutSVG');svg.innerHTML='';
  const cx=80,cy=80,R=72,r=48,gap=2.5,total=segments.reduce((s,x)=>s+x.val,0)||1;
  const gA=gap/R;let sA=-Math.PI/2;
  if(segments.length===1){
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',(R+r)/2);
    c.setAttribute('fill','none');c.setAttribute('stroke',segments[0].col);c.setAttribute('stroke-width',R-r);svg.appendChild(c);
  }else{
    segments.forEach(seg=>{
      const frac=seg.val/total,span=frac*2*Math.PI-gA*2;
      if(span<=0){sA+=frac*2*Math.PI;return;}
      const a1=sA+gA,a2=a1+span;
      const x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
      const x3=cx+r*Math.cos(a2),y3=cy+r*Math.sin(a2),x4=cx+r*Math.cos(a1),y4=cy+r*Math.sin(a1);
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',`M${x1},${y1}A${R},${R},0,${span>Math.PI?1:0},1,${x2},${y2}L${x3},${y3}A${r},${r},0,${span>Math.PI?1:0},0,${x4},${y4}Z`);
      p.setAttribute('fill',seg.col);svg.appendChild(p);sA+=frac*2*Math.PI;
    });
  }
  const bg=document.createElementNS('http://www.w3.org/2000/svg','circle');
  bg.setAttribute('cx',cx);bg.setAttribute('cy',cy);bg.setAttribute('r',r);bg.setAttribute('fill','#fff');svg.appendChild(bg);
}

function renderDonut(){
  const f=getFiltered();
  const sorted=Object.entries(f).sort((a,b)=>b[1]-a[1]);
  const segs=sorted.map(([t,v])=>({col:getColor(t),val:v}));
  if(!segs.length)segs.push({col:'#e0ede7',val:1});
  drawDonut(segs);
  document.getElementById('totalVal').textContent=Object.values(f).reduce((s,v)=>s+v,0).toLocaleString('de-DE');
}

function renderBars(){
  const f=getFiltered(),tot=totalIPs()||1;
  const sorted=Object.entries(f).sort((a,b)=>b[1]-a[1]);
  const maxV=sorted[0]?sorted[0][1]:1;
  const sec=document.getElementById('barSection');sec.innerHTML='';
  sorted.forEach(([team,ips])=>{
    const pct=Math.round(ips/tot*100),barW=Math.round(ips/maxV*100),col=getColor(team);
    sec.innerHTML+=`<div class="bar-row"><span class="bar-dot" style="background:${col}"></span><div class="bar-label" title="${team}">${team}</div><div class="bar-track"><div class="bar-fill" style="width:${barW}%;background:${col}"></div></div><div class="bar-pct">${pct}%</div><div class="bar-ip">${ips.toLocaleString('de-DE')}</div></div>`;
  });
}

function syncFilters(){
  const fr=document.getElementById('filterRow');
  const allTeams=[...new Set(members.map(m=>m.team))];
  const existing=new Set([...fr.querySelectorAll('[data-t]')].map(el=>el.dataset.t));
  allTeams.forEach(t=>{
    if(!existing.has(t)){
      getColor(t);
      const span=document.createElement('span');
      span.className='fbtn';span.dataset.t=t;
      span.setAttribute('onclick',`toggleTeam('${t}',this)`);
      span.textContent=t;
      fr.appendChild(span);
    }
  });
}

function renderTable(){
  const vis=visibleMembers();
  const activeIPs=vis.filter(m=>m.active).map(m=>calc(m).ips);
  const maxIPs=Math.max(...activeIPs,1);
  const paretoThreshold=maxIPs*0.8;
  const body=document.getElementById('tableBody');body.innerHTML='';
  vis.forEach(m=>{
    const {c,t,ips}=calc(m);
    const teamCol=getColor(m.team);
    const badgeBg=lighten(teamCol,0.88);
    const isPareto=m.active&&ips>=paretoThreshold;
    const row=document.createElement('div');row.className='trow'+(m.active?'':' dim');
    const grid=document.createElement('div');grid.className='trow-grid';
    const chk=document.createElement('div');
    chk.className='chk'+(m.active?' on':'');
    if(m.active)chk.innerHTML='<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="2,6 5,9 10,3"/></svg>';
    chk.addEventListener('click',()=>{m.active=!m.active;renderAll();scheduleSave();});
    const av=document.createElement('div');av.className='avatar';av.style.background=avColor(m.id);av.textContent=initials(m.name);
    const nm=document.createElement('div');nm.className='td-nm';
    const nameSpan=document.createElement('span');nameSpan.className='name-text';nameSpan.textContent=m.name;
    nm.appendChild(nameSpan);
    if(isPareto){const dot=document.createElement('span');dot.className='pareto-dot';nm.appendChild(dot);}
    const inp=document.createElement('input');
    inp.className='conv-field';inp.type='number';inp.min='1';inp.max='99';inp.value=m.conv;
    if(!m.active)inp.style.opacity='.35';
    inp.addEventListener('focus',()=>inp.select());
    inp.addEventListener('change',()=>{const v=Math.min(99,Math.max(1,parseInt(inp.value)||1));m.conv=v;inp.value=v;renderAll();scheduleSave();});
    const tdC=document.createElement('div');tdC.className='td-sm';tdC.textContent=c;
    const tdT=document.createElement('div');tdT.className='td-sm';tdT.textContent=t;
    const tdIPS=document.createElement('div');tdIPS.className='td-g';tdIPS.textContent=m.active?ips.toLocaleString('de-DE'):'—';
    const badge=document.createElement('div');badge.className='tbadge';badge.style.cssText=`background:${badgeBg};color:${teamCol}`;badge.textContent=m.team;badge.title=m.team;
    grid.append(chk,av,nm,inp,tdC,tdT,tdIPS,badge);
    row.appendChild(grid);body.appendChild(row);
  });
}

function renderAll(){
  updateDays();syncFilters();renderDonut();renderBars();renderTable();
  document.getElementById('cdNum').textContent=cd;
  document.getElementById('ipNum').textContent=ipVal;
  drawSmallRing('ringZeitraum',cd,CD_MIN,CD_MAX);
  drawSmallRing('ringIP',ipVal,IP_MIN,IP_MAX);
}

function changeCD(d){cd=Math.max(CD_MIN,Math.min(CD_MAX,cd+d));renderAll();scheduleSave();}
function changeIP(d){ipVal=Math.max(IP_MIN,Math.min(IP_MAX,ipVal+d));renderAll();scheduleSave();}

function toggleTeam(t,el){
  if(t==='alle'){
    activeTeams=new Set(['alle']);
    document.querySelectorAll('[data-t]').forEach(c=>{c.style.background='';c.style.borderColor='';c.style.color='';c.style.fontWeight='';});
    el.style.cssText='background:#1dbe70;border-color:#1dbe70;color:#fff;font-weight:600';
  }else{
    activeTeams.delete('alle');
    const allBtn=document.querySelector('[data-t="alle"]');
    allBtn.style.background='';allBtn.style.borderColor='';allBtn.style.color='';allBtn.style.fontWeight='';
    if(activeTeams.has(t)){activeTeams.delete(t);el.style.background='';el.style.borderColor='';el.style.color='';el.style.fontWeight='';}
    else{activeTeams.add(t);const col=getColor(t);el.style.background=col;el.style.borderColor=col;el.style.color='#fff';el.style.fontWeight='600';}
    if(activeTeams.size===0){activeTeams.add('alle');const a=document.querySelector('[data-t="alle"]');a.style.cssText='background:#1dbe70;border-color:#1dbe70;color:#fff;font-weight:600';}
  }
  renderAll();
}

let nextId=100;
function addMember(){
  const name=prompt('Name des Team Members:');if(!name||!name.trim())return;
  const conv=parseInt(prompt('Gespräche pro Tag:')||'1');
  const team=prompt('Teamname (z.B. Team Huber):');if(!team||!team.trim())return;
  members.push({id:nextId++,name:name.trim(),conv:isNaN(conv)?1:Math.max(1,Math.min(99,conv)),team:team.trim(),active:true});
  renderAll();scheduleSave();
}

document.getElementById('goalDate').addEventListener('change',()=>{updateDays();saveSettings();});
</script>
</body>
</html>
